
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CourtBook</title>

  <!-- Shared styles -->
  <link rel="stylesheet" href="../../../shared/css/global.css">
  <link rel="stylesheet" href="../../../shared/css/alert.css">

  <!-- Login styles -->
  <link rel="stylesheet" href="./login.css">

  <!-- Shared scripts -->
  <script src="../../../shared/js/alert.js" defer></script>

  <!-- Login script -->
  <script src="./login.js" defer></script>
</head>

<body>

  <main class="auth-page">

    <div class="auth-container">

      <!-- Branding -->
      <div class="auth-brand">
        <a href="#" class="brand-logo" aria-label="CourtBook">
          <span class="brand-icon">CB</span>
          <span class="brand-name">Court<span>Book</span></span>
        </a>

        <p class="brand-tagline">
          Your game starts here.
        </p>
      </div>

      <!-- Login card -->
      <section class="auth-card" aria-labelledby="login-title">

        <div class="auth-header">
          <h1 id="login-title">Welcome Back!</h1>
          <p>Sign in to your CourtBook account.</p>
        </div>

        <form id="login-form" novalidate>

          <!-- Email -->
          <div class="form-group">
            <label for="login-email">Email Address</label>

            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="login-password">Password</label>

            <div class="password-field">
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="toggle-password"
                class="password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <!-- Error message -->
          <p
            id="login-error"
            class="form-error"
            role="alert"
            aria-live="polite"
            hidden
          ></p>

          <!-- Submit -->
          <button
            type="submit"
            id="login-submit"
            class="login-button"
          >
            <span id="login-button-text">Sign In</span>
            <span
              id="login-spinner"
              class="button-spinner"
              aria-hidden="true"
              hidden
            ></span>
          </button>

        </form>

        <div class="auth-footer">
          <p>
            Don't have an account?
            <a href="../register/register.html">Create Account</a>
          </p>
        </div>

      </section>

      <p class="auth-bottom-text">
        © CourtBook. All rights reserved.
      </p>

    </div>

  </main>

</body>
</html>
